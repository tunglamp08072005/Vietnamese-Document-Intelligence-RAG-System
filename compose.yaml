services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_PATH: /data/app.db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: vietnamese_documents
      HF_HOME: /models/huggingface
      OCR_LANGUAGE: ${OCR_LANGUAGE:-vie+eng}
      OCR_DPI: ${OCR_DPI:-250}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      INDEX_BATCH_SIZE: ${INDEX_BATCH_SIZE:-128}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
      - model_cache:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build: .
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
      API_QUERY_TIMEOUT_SECONDS: ${API_QUERY_TIMEOUT_SECONDS:-660}
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  app_data:
  qdrant_data:
  model_cache:
